# Format:
#   <profile>|<ssh-host-alias>|<remote-base-dir-relative-to-remote-home>|<optional-shell-setup>
#
# Remote base directories are relative to the SSH user's home directory.
# Keep ssh details (user, port, identity file, ProxyJump, ControlMaster, etc.)
# in ~/.ssh/config and reference the Host alias here.
#
# Example ~/.ssh/config:
#   Host rocm-box
#       HostName 192.0.2.10
#       User developer
#       IdentityFile ~/.ssh/id_ed25519
#       ControlMaster auto
#       ControlPersist 10m
#       ControlPath ~/.ssh/cm-%C

rocm|bh2|agent-work/iom|source /home/rlew/rocm_env.sh 2>/dev/null || true
cuda|bh1|agent-work/iom|source /home/rlew/cuda_env.sh 2>/dev/null || true
ttnn|bh1|agent-work/iom|source /home/rlew/ttnn_env.sh 2>/dev/null || true
sycl|bh2|agent-work/iom|source /opt/intel/oneapi/setvars.sh 1>/dev/null 2>/dev/null || true
